name: Build, verify and release 1.20.4 - standard, MissAV and shared Windows app

on:
  workflow_dispatch:
    inputs:
      live_page_url:
        description: 'Source page for the authorized full-video verification'
        required: true
      live_media_url:
        description: 'Actual HLS VOD URL to verify before publishing'
        required: true

permissions:
  contents: read

concurrency:
  group: release-v1.20.4
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/codex/release-1.20.4'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve committed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Check changed code and release guards
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test tests/missav.test.ts tests/missav-collector.test.ts tests/missav-build.test.ts tests/missav-request-url.test.ts tests/missav-context.test.ts tests/page-fetch.test.ts 2>&1 | Tee-Object artifacts/extension-regression.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_missav_release.py -v 2>&1 | Tee-Object artifacts/release-guards.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_extension_folders.py -v 2>&1 | Tee-Object artifacts/extension-folders.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-missav-${{ hashFiles('desktop/dependencies-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-missav-
      - name: Build the dual-purpose Windows application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/desktop-runtime, artifacts/windows-verification | Out-Null
          if (!(Test-Path .cache/desktop-runtime/my-video-app-desktop-windows-x64.zip)) {
            gh release download v1.19.4 --repo $env:GITHUB_REPOSITORY --dir .cache/desktop-runtime --pattern my-video-app-desktop-windows-x64.zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B scripts/build-desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testRoot = Join-Path $env:RUNNER_TEMP 'Windows 앱 실행 검사'
          Expand-Archive -LiteralPath artifacts/my-video-app-desktop-windows-x64.zip -DestinationPath $testRoot
          $appRoot = Join-Path $testRoot 'MyVideoApp'
          "MYVIDEOAPP_TEST_ROOT=$appRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Join-Path $appRoot 'runtime/ffmpeg' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Operate the packaged Windows GUI with both download paths
        run: |
          $python = Join-Path $env:MYVIDEOAPP_TEST_ROOT 'runtime/python/python.exe'
          & $python -I -B tests/test_direct_hls.py --app-root $env:MYVIDEOAPP_TEST_ROOT -v 2>&1 | Tee-Object artifacts/windows-verification/direct-hls.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_missav.py --app-root $env:MYVIDEOAPP_TEST_ROOT -v 2>&1 | Tee-Object artifacts/windows-verification/missav-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_missav_gui.py --app-root $env:MYVIDEOAPP_TEST_ROOT -v 2>&1 | Tee-Object artifacts/windows-verification/gui-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_windows_gui_download.py --app-root $env:MYVIDEOAPP_TEST_ROOT --output artifacts/windows-verification/gui 2>&1 | Tee-Object artifacts/windows-verification/gui-download.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/windows-verification/gui/WINDOWS-GUI-VALIDATION.json artifacts/WINDOWS-GUI-VALIDATION.json
          @{version='1.20.4'; commit=$env:GITHUB_SHA; platform='windows-x64'; scope='release-three-variants-v1204'; desktopSha256=(Get-FileHash artifacts/my-video-app-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant(); nativeMissavTests=12; nativeGuiTests=1; directHlsTests=4; nativeDownloadGuiChecks=7; previousFullSuites='not repeated per user'} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/WINDOWS-VALIDATION.json
      - name: Install the locked verification browser
        run: |
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and operate both freshly installed extension variants
        run: |
          foreach ($variant in @('standard', 'missav')) {
            $env:MY_VIDEO_APP_EXTENSION_VARIANT = $variant
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --experimental-strip-types --test tests/missav-build.test.ts 2>&1 | Tee-Object "artifacts/$variant-build-check.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/extension-ui-installed-browser.mjs 2>&1 | Tee-Object "artifacts/$variant-ui.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item ".cache/extension-ui-installed-browser/$variant/VALIDATION.json" "artifacts/$($variant.ToUpperInvariant())-UI-VALIDATION.json"
            Copy-Item reports/build.json "artifacts/$($variant.ToUpperInvariant())-BUILD.json"
            python -B scripts/archive.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item artifacts/my-video-app-extension.zip "artifacts/my-video-app-extension-$variant.zip"
          }
          Remove-Item Env:MY_VIDEO_APP_EXTENSION_VARIANT
          node tests/missav-installed-browser.mjs 2>&1 | Tee-Object artifacts/installed-extension.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .cache/missav-installed-browser/INSTALLED-EXTENSION-VALIDATION.json artifacts/INSTALLED-EXTENSION-VALIDATION.json
      - name: Retain the unchanged optional antivirus helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item artifacts/my-video-app-antivirus-helper.zip
          gh release download v1.19.4-bundle.1 --repo $env:GITHUB_REPOSITORY --dir artifacts --pattern my-video-app-antivirus-helper.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the full actual video through the release extension UI
        env:
          MYVIDEOAPP_LIVE_PAGE_URL: ${{ inputs.live_page_url }}
          MYVIDEOAPP_LIVE_MEDIA_URL: ${{ inputs.live_media_url }}
        run: |
          node tests/extension-live-browser.mjs 2>&1 | Tee-Object artifacts/live-download.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/live-windows-verification/LIVE-VALIDATION.json artifacts/LIVE-VALIDATION.json
      - name: Prepare and verify the exact release archives
        run: |
          python -B scripts/release-missav.py --artifacts artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer only verified release files to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-1.20.4-${{ github.sha }}
          path: |
            artifacts/my-video-app-extension-standard.zip
            artifacts/my-video-app-extension-missav.zip
            artifacts/my-video-app-desktop-windows-x64.zip
            artifacts/my-video-app-antivirus-helper.zip
            artifacts/my-video-app-source.zip
            artifacts/*.json
            artifacts/SHA256SUMS-RELEASE.txt
            artifacts/release-notes.md
          retention-days: 7
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification-${{ github.run_id }}
          path: |
            artifacts/*.log
            artifacts/*.json
            artifacts/windows-verification/*.log
            artifacts/windows-verification/gui/*.json
            artifacts/windows-verification/gui/*.png
            artifacts/windows-verification/gui/*.log
            artifacts/live-windows-verification/*.json
            artifacts/live-windows-verification/*.log
          retention-days: 7

  publish:
    needs: build-and-verify
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/codex/release-1.20.4'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-1.20.4-${{ github.sha }}
          path: artifacts
      - name: Recheck every ZIP and publish the complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release-missav.py --artifacts artifacts --publish
