name: Measure additional encoding speed without publishing
on:
  workflow_dispatch:
    inputs:
      live_page_url:
        description: 'Source page for the paired full-video measurement'
        required: true
      live_media_url:
        description: 'Identical video URL for all four runs'
        required: true
permissions:
  contents: read
jobs:
  speed-comparison:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/codex/speed-encode-20261117'
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify the candidate
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test tests/page-fetch.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out the exact decoder-optimized baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9e0999e56a3bff484f3c4b3e306594897778df6d
          path: .cache/speed-baseline/source
          persist-credentials: false
      - name: Build the fixed baseline in a separate directory
        working-directory: .cache/speed-baseline/source
        run: |
          if ((git rev-parse HEAD) -ne '9e0999e56a3bff484f3c4b3e306594897778df6d') { throw 'Baseline source mismatch' }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content reports/build-missav.json -Raw | ConvertFrom-Json
          if ($report.buildSha256 -ne 'd2370d847b54dbf12c5583769ae9ef71fd882ff3b206c3a80c12fb23dafffcd7') { throw 'Baseline build identity mismatch' }
          Copy-Item -Recurse extensions/missav ../my-video-app-missav
          Copy-Item reports/build-missav.json ../MISSAV-BUILD.json
      - name: Prepare the pinned media verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/speed-ffmpeg, artifacts/speed-verification | Out-Null
          gh release download v1.20.3 --repo $env:GITHUB_REPOSITORY --dir .cache/speed-ffmpeg --pattern my-video-app-desktop-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash .cache/speed-ffmpeg/my-video-app-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e80ce5c39000559c0241a7796e0ea0af8e5db7775e44f413d0d8a24d6557c095') { throw 'Pinned media verifier mismatch' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path .cache/speed-ffmpeg/my-video-app-desktop-windows-x64.zip))
          try {
            foreach ($tool in @('ffmpeg', 'ffprobe')) {
              $entry = $archive.GetEntry("MyVideoApp/runtime/ffmpeg/$tool.exe")
              if ($null -eq $entry) { throw 'Missing pinned media verifier' }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path (Resolve-Path .cache/speed-ffmpeg) "$tool.exe"), $true)
            }
          } finally { $archive.Dispose() }
          (Resolve-Path .cache/speed-ffmpeg).Path | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compare four complete downloads on this Windows runner
        env:
          MYVIDEOAPP_LIVE_PAGE_URL: ${{ inputs.live_page_url }}
          MYVIDEOAPP_LIVE_MEDIA_URL: ${{ inputs.live_media_url }}
          MYVIDEOAPP_SPEED_BASELINE_COMMIT: 9e0999e56a3bff484f3c4b3e306594897778df6d
        run: |
          node tests/speed-live-browser.mjs 2>&1 | Tee-Object artifacts/speed-verification/compare.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain measurements without publishing builds or videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speed-comparison-${{ github.run_id }}
          path: |
            artifacts/speed-verification/*.json
            artifacts/speed-verification/*.log
            artifacts/speed-verification/*/*.json
          retention-days: 7
