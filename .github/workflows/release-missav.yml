name: Measure large video save time against v1.20.5
on:
  workflow_dispatch:
    inputs:
      live_page_url:
        description: 'Source page for the paired full-video measurement'
        required: true
      live_media_url:
        description: 'Identical video URL for all four runs'
        required: true
permissions:
  contents: read
jobs:
  speed-comparison:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/codex/large-video-speed-20261127'
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Build and verify the candidate
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types --test tests/page-fetch.test.ts tests/disk-assets.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/playwright-core/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the exact published baseline and media verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .cache/speed-baseline, .cache/speed-ffmpeg, artifacts/speed-verification | Out-Null
          gh release download v1.20.5 --repo $env:GITHUB_REPOSITORY --dir .cache/speed-baseline --pattern my-video-app-extension-missav.zip --pattern MISSAV-BUILD.json --pattern my-video-app-desktop-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pins = @{
            'my-video-app-extension-missav.zip'='db0197fdb8a42659761466f3da7be0960099a0190ec48a29351c43713f0c6787';
            'MISSAV-BUILD.json'='b2b8b4c4b17e2a1523ee05a329a4f405f6e653578c82b117d59a8c1bb8985eb3';
            'my-video-app-desktop-windows-x64.zip'='349b49b27fe864805f28ca6693688412135e4730ca712e6d9703d6d9212900b6'
          }
          foreach ($file in $pins.Keys) {
            if ((Get-FileHash ".cache/speed-baseline/$file" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins[$file]) { throw 'Published baseline mismatch' }
          }
          Expand-Archive .cache/speed-baseline/my-video-app-extension-missav.zip .cache/speed-baseline
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path .cache/speed-baseline/my-video-app-desktop-windows-x64.zip))
          try {
            foreach ($tool in @('ffmpeg', 'ffprobe')) {
              $entry = $archive.GetEntry("MyVideoApp/runtime/ffmpeg/$tool.exe")
              if ($null -eq $entry) { throw 'Missing pinned media verifier' }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path (Resolve-Path .cache/speed-ffmpeg) "$tool.exe"), $true)
            }
          } finally { $archive.Dispose() }
          (Resolve-Path .cache/speed-ffmpeg).Path | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compare four complete downloads on this Windows runner
        env:
          MYVIDEOAPP_LIVE_PAGE_URL: ${{ inputs.live_page_url }}
          MYVIDEOAPP_LIVE_MEDIA_URL: ${{ inputs.live_media_url }}
        run: |
          node tests/speed-live-browser.mjs 2>&1 | Tee-Object artifacts/speed-verification/compare.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain measurements without publishing builds or videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: speed-comparison-${{ github.run_id }}
          path: |
            artifacts/speed-verification/*.json
            artifacts/speed-verification/*.log
            artifacts/speed-verification/*/*.json
          retention-days: 7
