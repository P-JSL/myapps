name: Publish extension and Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - package.json
      - desktop/**
      - scripts/build-desktop.py
      - scripts/publish-release.py
      - scripts/package.mjs
      - tests/test_transport_release.py
      - tests/desktop_transport_server.py
      - tests/requirements-desktop-transport.lock
      - artifacts/my-video-app-extension.zip
      - artifacts/my-video-app-source.zip
      - artifacts/SHA256SUMS
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Official actions/checkout v6, pinned to its upstream Git tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified public runtime archives
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-runtime-

      - name: Build the pinned portable Windows app
        run: python -B scripts/build-desktop.py

      - name: Verify only the new packaged desktop transport scope
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/my-video-app-desktop-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/myvideoapp-transport"
          $appRoot = "$env:RUNNER_TEMP/myvideoapp-transport/MyVideoApp"
          $python = "$appRoot/runtime/python/python.exe"
          $dependencyRoot = "$env:RUNNER_TEMP/myvideoapp-transport-fixtures"
          # Only local TLS/QUIC servers use these fixture packages. The client
          # transport must import the actual application's bundled curl_cffi.
          & $python -I -B -m pip install --require-hashes --no-deps --only-binary=:all: --target "$dependencyRoot" -r tests/requirements-desktop-transport.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $python -I -B tests/test_transport_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_bandwidth.py --app-root "$appRoot" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_transfer.py --app-root "$appRoot" --dependency-root "$dependencyRoot" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_transport.py --app-root "$appRoot" --dependency-root "$dependencyRoot" --report artifacts/DESKTOP-TRANSPORT-TESTS.json -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_transport_engine.py --app-root "$appRoot" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $transportProof = Get-Content artifacts/DESKTOP-TRANSPORT-TESTS.json | ConvertFrom-Json
          $expectedProtocols = @("h3", "h2", "http/1.1")
          if ($transportProof.status -ne "passed" -or @($transportProof.protocols).Count -ne 3 -or @($expectedProtocols | Where-Object { $_ -notin $transportProof.protocols }).Count -ne 0) { throw "Actual packaged HTTP/3, HTTP/2 and HTTP/1.1 loopback proof is required" }
          # Prior checks are deliberately skipped at the user's request.
          @{version=(Get-Content package.json | ConvertFrom-Json).version; commit=$env:GITHUB_SHA; platform="windows-x64"; validationMode="focused-desktop-transport"; baseline="v1.18.0"; baselineCommit="1756c8dec1cb6e655fd486ab4a55fcc35641fd74"; desktopSha256=(Get-FileHash artifacts/my-video-app-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant(); bandwidthTests="passed"; rangeTests="passed"; transportTests="passed"; engineTransportTests="passed"; releaseScopeTests="passed"; actualProtocols=@($transportProof.protocols); transportReportSha256=(Get-FileHash artifacts/DESKTOP-TRANSPORT-TESTS.json -Algorithm SHA256).Hash.ToLowerInvariant(); priorChecks="skipped-per-user"; liveYouTubeVerified=$false; publicWANBenchmarked=$false} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/WINDOWS-VALIDATION.json

      - name: Publish both products in one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish-release.py

      - name: Cache verified public runtime archives
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
