name: Publish extension and Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - package.json
      - desktop/**
      - scripts/build-desktop.py
      - scripts/publish-release.py
      - scripts/package.mjs
      - tests/test_transport_release.py
      - tests/desktop_transport_server.py
      - tests/requirements-desktop-transport.lock
      - tests/test_activity_release.py
      - tests/test_no_http3_release.py
      - tests/test_v18_restore_release.py
      - artifacts/my-video-app-extension.zip
      - artifacts/my-video-app-source.zip
      - artifacts/SHA256SUMS
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Official actions/checkout v6, pinned to its upstream Git tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified public runtime archives
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-runtime-

      - name: Build the pinned portable Windows app
        run: python -B scripts/build-desktop.py

      - name: Verify only the new desktop v1.18 restore scope
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/my-video-app-desktop-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/myvideoapp-v18-restore"
          $appRoot = "$env:RUNNER_TEMP/myvideoapp-v18-restore/MyVideoApp"
          $python = "$appRoot/runtime/python/python.exe"
          & $python -I -B tests/test_v18_restore_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_v18_restore.py --app-root "$appRoot" --real-download -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_v18_restore_gui.py --app-root "$appRoot" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # All previous suites stay skipped at the user's request.
          @{version=(Get-Content -Encoding utf8 package.json | ConvertFrom-Json).version; commit=$env:GITHUB_SHA; platform="windows-x64"; validationMode="focused-desktop-v18-restore"; baseline="v1.19.3"; baselineCommit="2d11e5043fa403fbe373feb7c168e490f4ef0b69"; downloadBaseline="v1.18.0"; downloadBaselineCommit="1756c8dec1cb6e655fd486ab4a55fcc35641fd74"; desktopSha256=(Get-FileHash artifacts/my-video-app-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant(); v18RestoreTests="passed"; v18RestoreGuiTests="passed"; releaseScopeTests="passed"; priorChecks="skipped-per-user"; liveYouTubeVerified=$false} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/WINDOWS-VALIDATION.json

      - name: Publish both products in one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish-release.py

      - name: Cache verified public runtime archives
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
