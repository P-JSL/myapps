name: Publish extension and Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - package.json
      - desktop/**
      - scripts/build-desktop.py
      - scripts/publish-release.py
      - scripts/package.mjs
      - tests/test_transport_release.py
      - tests/desktop_transport_server.py
      - tests/requirements-desktop-transport.lock
      - artifacts/my-video-app-extension.zip
      - artifacts/my-video-app-source.zip
      - artifacts/SHA256SUMS
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Official actions/checkout v6, pinned to its upstream Git tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified public runtime archives
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-desktop-runtime-

      - name: Build the pinned portable Windows app
        run: python -B scripts/build-desktop.py

      - name: Verify only the affected download recovery path
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/my-video-app-desktop-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/myvideoapp-recovery"
          $appRoot = "$env:RUNNER_TEMP/myvideoapp-recovery/MyVideoApp"
          $python = "$appRoot/runtime/python/python.exe"
          & $python -I -B tests/test_download_recovery_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I -B desktop/test_download_recovery.py --app-root "$appRoot" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Earlier protocol, bandwidth, GUI and whole-application suites stay skipped.
          @{version=(Get-Content package.json | ConvertFrom-Json).version; commit=$env:GITHUB_SHA; platform="windows-x64"; validationMode="focused-download-recovery"; baseline="v1.19.0"; baselineCommit="b09935f7d1ce9fe6f4003bce4d8a87d8e09d826a"; desktopSha256=(Get-FileHash artifacts/my-video-app-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant(); recoveryTests="passed"; releaseScopeTests="passed"; priorChecks="skipped-per-user"; liveYouTubeVerified=$false} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/WINDOWS-VALIDATION.json

      - name: Publish both products in one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish-release.py

      - name: Cache verified public runtime archives
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
