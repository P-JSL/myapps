name: Publish extension and Windows desktop app

on:
  push:
    branches: [main]
    paths:
      - package.json
      - desktop/**
      - scripts/build-desktop.py
      - scripts/publish-release.py
      - artifacts/my-video-app-extension.zip
      - artifacts/my-video-app-source.zip
      - artifacts/SHA256SUMS
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Official actions/checkout v6, pinned to its upstream Git tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified public runtime archives
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}

      - name: Build the pinned portable Windows app
        run: python -B scripts/build-desktop.py

      - name: Check release and rollback safety
        run: python -B -m unittest discover -s tests -p test_publish_release.py -v

      - name: Verify the actual packaged Windows runtime and GUI
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath artifacts/my-video-app-desktop-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/myvideoapp-smoke"
          $appRoot = "$env:RUNNER_TEMP/myvideoapp-smoke/MyVideoApp"
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$appRoot/runtime/python/python.exe" -I -B "$appRoot/desktop/main.py" --data-dir "$env:RUNNER_TEMP/myvideoapp-ui-data" --smoke-test --screenshot "$env:RUNNER_TEMP/myvideoapp-gui.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$appRoot/runtime/python/python.exe" -I -B desktop/test_gui.py --app-root "$appRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$appRoot/runtime/python/python.exe" -I -B desktop/test_runtime.py --app-root "$appRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{version=(Get-Content package.json | ConvertFrom-Json).version; commit=$env:GITHUB_SHA; platform="windows-x64"; packagedGui="passed"; guiQueueTests="passed"; localMediaMp4Mp3M4a="passed"; liveYouTubeVerified=$false} | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/WINDOWS-VALIDATION.json

      - name: Publish both products in one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish-release.py

      - name: Cache verified public runtime archives
        if: always() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/desktop-runtime
          key: ${{ runner.os }}-desktop-runtime-${{ hashFiles('desktop/dependencies-lock.json') }}
