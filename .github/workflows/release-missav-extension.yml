name: Legacy 1.19 - publish two Chrome extension variants (standard and MissAV)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-missav-chrome-v1.19.4-missav.2
  cancel-in-progress: false

jobs:
  extension-release:
    if: github.repository == 'P-JSL/myapps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up pinned Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript, source policy, and tests
        run: |
          npm run typecheck
          npm run check:source
          npm test

      - name: Build STANDARD extension from untouched pre-MissAV detector
        env:
          MY_VIDEO_APP_EXTENSION_VARIANT: standard
        run: |
          npm run build
          python3 - <<'PY'
          import json
          from pathlib import Path
          build = json.loads(Path('reports/build.json').read_text(encoding='utf-8'))
          entries = {e['logicalOutput']: e for e in build['entries']}
          for output, original, patched in (
              ('local/collect.js', 'src/local/collect-standard.ts', 'src/local/collect.ts'),
              ('local/background.js', 'src/local/background-standard.ts', 'src/local/background.ts'),
          ):
              inputs = entries[output]['inputs']
              assert original in inputs and patched not in inputs, 'Standard variant runtime mismatch: ' + output
              assert 'src/local/missav.ts' not in inputs, 'MissAV extractor leaked into standard: ' + output
          PY
          python3 -B scripts/archive.py
          mv artifacts/my-video-app-extension.zip artifacts/my-video-app-extension-standard.zip

      - name: Build MISSAV extension with video request discovery
        env:
          MY_VIDEO_APP_EXTENSION_VARIANT: missav
        run: |
          npm run build
          python3 - <<'PY'
          import json
          from pathlib import Path
          build = json.loads(Path('reports/build.json').read_text(encoding='utf-8'))
          entries = {e['logicalOutput']: e for e in build['entries']}
          for output, patched, original in (
              ('local/collect.js', 'src/local/collect.ts', 'src/local/collect-standard.ts'),
              ('local/background.js', 'src/local/background.ts', 'src/local/background-standard.ts'),
          ):
              inputs = entries[output]['inputs']
              assert patched in inputs and original not in inputs, 'MissAV variant runtime mismatch: ' + output
              assert 'src/local/missav.ts' in inputs, 'MissAV extractor missing: ' + output
          PY
          python3 -B scripts/archive.py
          mv artifacts/my-video-app-extension.zip artifacts/my-video-app-extension-missav.zip

      - name: Verify the two distinct archives and SHA-256 checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('artifacts')
          names = [
              'my-video-app-extension-standard.zip',
              'my-video-app-extension-missav.zip',
              'my-video-app-source.zip',
              'my-video-app-antivirus-helper.zip',
          ]
          fingerprints = {}
          manifests = []
          script_sha = []
          for name in names:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, name
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, 'Invalid ZIP: ' + name
                  if name.startswith('my-video-app-extension-'):
                      manifest = json.loads(archive.read('my-video-app/manifest.json'))
                      assert manifest['version'] == '1.19.4'
                      assert manifest['permissions'] == ['tabs', 'webRequest', 'downloads',
                          'storage', 'unlimitedStorage', 'offscreen', 'sidePanel',
                          'notifications', 'contextMenus']
                      assert 'tabCapture' not in manifest['permissions']
                      script = 'my-video-app/' + manifest['content_scripts'][0]['js'][0]
                      script_sha.append(hashlib.sha256(archive.read(script)).hexdigest())
                      manifests.append(manifest)
              fingerprints[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(script_sha) == 2 and script_sha[0] != script_sha[1], 'Standard/MissAV scripts are identical'
          assert manifests[0]['host_permissions'] == manifests[1]['host_permissions'], 'Variant changed permissions'
          sums = root / 'SHA256SUMS-MISSAV.txt'
          sums.write_text(''.join(digest + '  ' + name + '\n' for name, digest in fingerprints.items()), encoding='utf-8')
          for name, digest in fingerprints.items():
              print(name, digest)
          PY

      - name: Publish distinct MissAV and standard ZIPs without changing Windows latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.19.4-missav.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite assets."
            exit 1
          fi
          cat > missav-release-notes.md <<'EOF'
          ## My Video App v1.19.4 · Chrome 확장 선택 다운로드

          두 ZIP은 서로 다른 Chrome 확장 변형이며 **한 가지만 설치**해야 합니다.

          - **my-video-app-extension-standard.zip:** MissAV 지원 기능을 추가하지 않은 기존 범용 확장입니다. 원본 감지기와 일반 미디어/HLS/DASH 다운로드를 유지합니다.
          - **my-video-app-extension-missav.zip:** 기존 기능을 유지하면서 MissAV 미러 플레이어의 UUID, CDN HLS 재생목록, 브라우저가 요청한 HLS 주소를 추가 감지합니다.
          - **my-video-app-source.zip:** 두 빌드의 소스 코드.
          - **my-video-app-antivirus-helper.zip:** 선택적 로컬 백신 연동.
          - **SHA256SUMS-MISSAV.txt:** 4개 ZIP의 SHA-256 체크섬.

          Windows 데스크톱은 변경하지 않았으며 정식 v1.19.4 릴리즈를 그대로 사용합니다.
          네트워크 정책·CDN 접근 차단·DRM은 우회하지 않으므로 특정 페이지의 HTTP 403에서는 저장이 실패할 수 있습니다.
          실제 웹사이트 실재생·다운로드는 이 CI에서 검증하지 않았습니다.
          EOF
          gh release create "$tag" \
            artifacts/my-video-app-extension-standard.zip \
            artifacts/my-video-app-extension-missav.zip \
            artifacts/my-video-app-source.zip \
            artifacts/my-video-app-antivirus-helper.zip \
            artifacts/SHA256SUMS-MISSAV.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'My Video App v1.19.4 · Standard + MissAV Chrome 확장' \
            --notes-file missav-release-notes.md \
            --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets,url
