<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Video App</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
<div class="popup-shell">
  <main>
    <section id="waiting" class="waiting" aria-label="미디어 대기">
      <img class="app-logo" src="../bitmaps/logo-128-color.png" width="48" height="48" alt="My Video App">
      <h1>미디어 대기 중...</h1>
    </section>
    <section id="media-view" class="media-view" aria-labelledby="media-heading" hidden>
      <div class="media-heading"><h1 id="media-heading">감지된 미디어</h1><span id="media-count"></span></div>
      <ul id="media" aria-label="현재 탭의 미디어"></ul>
    </section>
  </main>
  <div class="notices">
    <button id="review-summary" class="review-summary" hidden></button>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </div>
  <aside id="discovery-card" class="discovery-card" aria-labelledby="discovery-heading">
    <button id="dismiss-hint" aria-label="감지 도움말 닫기" title="닫기">×</button>
    <p id="discovery-heading">찾으시는 미디어가 보이지 않나요?</p>
    <p class="discovery-copy">미디어 감지를 위해 동영상을 재생하세요 (광고가 있다면 건너뛰세요). 또는 미디어 누락을 신고하세요.</p>
    <div class="discovery-actions"><button id="rescan">강제 감지</button><button id="report">신고</button></div>
  </aside>
  <footer aria-label="앱 도구">
    <button id="settings" class="icon-button" title="설정" aria-label="설정 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.4-2 .9-2.3-.7-2 3.4 1.7 1.8v2.4l-1.7 1.8 2 3.4 2.3-.7 2 .9.7 2.4h4.1l.7-2.4 2-.9 2.3.7 2-3.4-1.7-1.8v-2.4L20.6 9l-2-3.4-2.3.7-2-.9-.7-2.4z"/><circle cx="11.6" cy="12" r="3.2"/></svg></button>
    <div class="footer-actions">
      <button id="history" class="icon-button" title="다운로드 기록" aria-label="다운로드 기록 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/></svg></button>
      <button id="folder" class="icon-button" title="다운로드 폴더" aria-label="다운로드 폴더 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v11H3zM3 9V5h7l2 3"/></svg></button>
      <button id="clear-history" class="icon-button" title="완료 기록만 삭제 (저장한 파일은 유지)" aria-label="완료 기록만 삭제, 저장한 파일은 유지"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg></button>
      <button id="help" class="icon-button" title="도움말" aria-label="도움말 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.4 8.5a2.7 2.7 0 0 1 5.2 1c0 2-2.6 2-2.6 4M12 17h.01"/></svg></button>
      <button id="upscale" class="icon-button" title="미디어 도구" aria-label="미디어 도구 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </div>
  </footer>
</div>
<dialog id="info-dialog" aria-labelledby="info-title" aria-describedby="info-description">
  <h2 id="info-title"></h2><p id="info-description"></p>
  <label id="report-label" for="report-notes" hidden>사이트 주소와 증상 메모 (이 창에서만 유지)</label>
  <textarea id="report-notes" rows="4" maxlength="4000" hidden></textarea>
  <form method="dialog"><button id="info-close" value="close">닫기</button></form>
</dialog>
</body>
</html>
